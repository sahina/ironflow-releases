# Links the SDK you built locally, so an edit in sdk/js/node shows up here
# without a reinstall. `workspace:*` in package.json resolves against these.
packages:
  - '../../sdk/js/core'
  - '../../sdk/js/browser'
  - '../../sdk/js/node'

# tsx and vitest both need esbuild's platform binary, which only lands if its
# postinstall is allowed to run. better-sqlite3 is a native module — same deal,
# without its postinstall there is no compiled binding to load.
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
allowBuilds:
  esbuild: true
  better-sqlite3: true
