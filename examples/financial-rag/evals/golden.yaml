# Golden set — the ground truth the promotion gate scores against.
#
# These answers are EXACT, not approximate, because the corpus is generated by
# `pnpm seed-corpus` and the figures are authored in scripts/seed-corpus.ts.
# If you swap in real EDGAR filings, every expectedValue here becomes wrong and
# must be re-derived by reading the filing.
#
# The restatement rows are the interesting ones: ACME_2024-Q3 exists twice,
# filed 2024-11-01 and restated 2025-02-14. The later filing wins, so the
# expected revenue is 1,251,000 and NOT the original 1,284,000. A broken
# supersession rule fails exactly those rows and passes the rest, which is what
# makes them worth having.

- id: revenue-restated
  question: What was ACME's total revenue in Q3 2024?
  expectedValue: "1251000"
  expectedDoc: ACME_2024-Q3_2025-02-14
  notes: Restated down from 1,284,000. The later filing is the answer.

- id: net-income-restated
  question: What was ACME's net income for Q3 2024?
  expectedValue: "246000"
  expectedDoc: ACME_2024-Q3_2025-02-14
  notes: Moves with the revenue restatement.

- id: gross-profit-restated
  question: What gross profit did ACME report for Q3 2024?
  expectedValue: "739000"
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: operating-income-restated
  question: What was ACME's operating income in Q3 2024?
  expectedValue: "321000"
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: cost-of-revenue
  question: What was ACME's cost of revenue in Q3 2024?
  expectedValue: "512000"
  expectedDoc: ACME_2024-Q3_2025-02-14
  notes: Unchanged by the restatement — same in both filings.

- id: operating-expenses
  question: What were ACME's operating expenses in Q3 2024?
  expectedValue: "418000"
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: revenue-prior-year
  question: What was ACME's total revenue in Q3 2023?
  expectedValue: "1102000"
  expectedDoc: ACME_2024-Q3_2025-02-14
  notes: Prior-year comparative column, unchanged by the restatement.

- id: net-income-prior-year
  question: What was ACME's net income in Q3 2023?
  expectedValue: "183000"
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: acronym-arr
  question: What does ARR stand for in ACME's filing?
  expectedContains: ["annual recurring revenue"]
  expectedDoc: ACME_2024-Q3_2025-02-14
  notes: Prose retrieval, no figure. Tests that the narrative page is indexed.

- id: acronym-nrr
  question: What does NRR mean in ACME's filing?
  expectedContains: ["net revenue retention"]
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: non-gaap-caveat
  question: Are ACME's ARR and NRR figures GAAP measures?
  expectedContains: ["non-GAAP"]
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: revenue-driver
  question: What drove ACME's revenue growth this quarter?
  expectedContains: ["enterprise"]
  expectedDoc: ACME_2024-Q3_2025-02-14

- id: coverage-miss
  question: What was ACME's total revenue in Q1 2022?
  expectedContains: ["not", "cover"]
  notes: >
    Deliberately outside the corpus. A correct system says it does not know and
    lists what it has. A system that invents a figure fails here, and this is
    the single most valuable row in the set.
