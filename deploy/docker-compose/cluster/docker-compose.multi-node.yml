# deploy/docker-compose/cluster/docker-compose.multi-node.yml
# Simple multi-node dev cluster: single NATS + PostgreSQL + 3 ironflow nodes + nginx LB
# (For a 3-node NATS quorum, use docker-compose.cluster.yml instead.)
services:
  nats:
    image: nats:2.12.5-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ironflow
      POSTGRES_USER: ironflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared S3 backend. A node started with --nats-url is multi-node, and the E5
  # gate (#411) requires a shared s3:// blob backend or it refuses to boot.
  # -ip.bind=0.0.0.0 binds loopback so the in-container healthcheck works.
  # MinIO rejected (registry+license); see ADR-0035.
  seaweedfs:
    image: chrislusf/seaweedfs:4.31
    command:
      ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "8333:8333" # S3 API
    volumes:
      - ../seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  ironflow-1:
    image: ${IRONFLOW_IMAGE:-ironflow:latest}
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: serve --nats-url=nats://nats:4222 --port=9123 --node-id=node-1
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:-ironflow}@postgres:5432/ironflow?sslmode=disable
      IRONFLOW_MASTER_KEY:
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): --nats-url makes this a multi-node node, which requires a
      # shared s3:// blob backend or it refuses to boot. Offload is off by
      # default (no IRONFLOW_ARTIFACT_THRESHOLD), so no bucket is needed to boot.
      IRONFLOW_BLOB_URL: s3://ironflow-dev-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ironflowtest}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ironflowtestsecret}
    ports:
      - "9123:9123"
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-2:
    image: ${IRONFLOW_IMAGE:-ironflow:latest}
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: serve --nats-url=nats://nats:4222 --port=9124 --node-id=node-2
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:-ironflow}@postgres:5432/ironflow?sslmode=disable
      IRONFLOW_MASTER_KEY:
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): --nats-url makes this a multi-node node, which requires a
      # shared s3:// blob backend or it refuses to boot. Offload is off by
      # default (no IRONFLOW_ARTIFACT_THRESHOLD), so no bucket is needed to boot.
      IRONFLOW_BLOB_URL: s3://ironflow-dev-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ironflowtest}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ironflowtestsecret}
    ports:
      - "9124:9124"
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-3:
    image: ${IRONFLOW_IMAGE:-ironflow:latest}
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: serve --nats-url=nats://nats:4222 --port=9125 --node-id=node-3
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:-ironflow}@postgres:5432/ironflow?sslmode=disable
      IRONFLOW_MASTER_KEY:
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): --nats-url makes this a multi-node node, which requires a
      # shared s3:// blob backend or it refuses to boot. Offload is off by
      # default (no IRONFLOW_ARTIFACT_THRESHOLD), so no bucket is needed to boot.
      IRONFLOW_BLOB_URL: s3://ironflow-dev-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ironflowtest}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ironflowtestsecret}
    ports:
      - "9125:9125"
    depends_on:
      nats: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    ports:
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Observability (profile: monitoring). Scrapes /metrics from all three
  # ironflow nodes via cluster/prometheus.yml. Start with:
  #   docker compose -f docker-compose.multi-node.yml --profile monitoring up
  # Grafana: point a Grafana instance at http://localhost:9090. See
  # docs/how-to-guides/observability.mdx for example queries.
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Tracing backend (profile: monitoring). Receives OTLP traces from every
  # ironflow node at :4317. UI at http://localhost:16686. See observability.mdx.
  jaeger:
    image: jaegertracing/jaeger:2.19.0
    profiles:
      - monitoring
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC ingest

  # Dashboards (profile: monitoring). Auto-provisions the Prometheus datasource
  # and the Ironflow dashboards from ./grafana. UI at http://localhost:3000:
  # anonymous read-only (Viewer); log in as admin to edit. Dev defaults — set
  # GRAFANA_ADMIN_PASSWORD before exposing this stack beyond localhost.
  grafana:
    image: grafana/grafana:13.0.2
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # NATS metrics exporter (profile: monitoring). NATS serves JSON on :8222
  # (/varz, /connz) — not Prometheus format — so this translates it to /metrics
  # on :7777, which Prometheus scrapes for the NATS Monitoring dashboard.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.1
    profiles:
      - monitoring
    command: ["-varz", "-connz", "-subz", "-routez", "-port=7777", "http://nats:8222"]
    depends_on:
      - nats

volumes:
  postgres_data:
