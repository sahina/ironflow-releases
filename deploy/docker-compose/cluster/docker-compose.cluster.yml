# deploy/docker-compose/cluster/docker-compose.cluster.yml
# Cluster: 3-node NATS JetStream cluster + 3 ironflow nodes behind nginx (:9000).
# Needs a .env from ./init-env.sh. Only nginx listens on all interfaces; every
# other port binds to 127.0.0.1.
name: ironflow-cluster
services:
  nats-1:
    restart: unless-stopped
    image: nats:2.15.2-alpine
    configs:
      - source: nats_conf
        target: /etc/nats/nats.conf
    command:
      - "-c=/etc/nats/nats.conf"
      - "-js"
      - "-n=nats-1"
      - "-sd=/data"
      - "-cluster"
      - "nats://nats-1:6222"
      - "-routes=nats://nats-2:6222,nats://nats-3:6222"
      - "-m=8222"
      - "--cluster_name=ironflow-cluster"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-2:
    restart: unless-stopped
    image: nats:2.15.2-alpine
    configs:
      - source: nats_conf
        target: /etc/nats/nats.conf
    command:
      - "-c=/etc/nats/nats.conf"
      - "-js"
      - "-n=nats-2"
      - "-sd=/data"
      - "-p=4223"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-2:6222"
      - "-routes=nats://nats-1:6222,nats://nats-3:6222"
      - "--cluster_name=ironflow-cluster"
    ports:
      - "127.0.0.1:4223:4223"
    volumes:
      - nats_2_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-3:
    restart: unless-stopped
    image: nats:2.15.2-alpine
    configs:
      - source: nats_conf
        target: /etc/nats/nats.conf
    command:
      - "-c=/etc/nats/nats.conf"
      - "-js"
      - "-n=nats-3"
      - "-sd=/data"
      - "-p=4224"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-3:6222"
      - "-routes=nats://nats-1:6222,nats://nats-2:6222"
      - "--cluster_name=ironflow-cluster"
    ports:
      - "127.0.0.1:4224:4224"
    volumes:
      - nats_3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  postgres:
    restart: unless-stopped
    # Frozen at the major that initdb'd postgres_cluster_data. Set POSTGRES_IMAGE in
    # .env to move it, and read the note there first.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ironflow
      POSTGRES_USER: ironflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
    ports:
      # Set POSTGRES_HOST_PORT when a host PostgreSQL already holds 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_cluster_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironflow"]
      interval: 5s
      retries: 10

  # Shared S3 backend for the cluster blob-overflow e2e (#1195 item 3). Every
  # node points IRONFLOW_BLOB_URL at this one bucket so a blob offloaded on one
  # node inflates when read on another (shared-backend invariant). -ip.bind makes
  # services bind loopback for the in-container healthcheck. MinIO rejected
  # (registry+license); see ADR-0035.
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.48
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-ip.bind=0.0.0.0",
      ]
    ports:
      # Set S3_HOST_PORT when another service already holds 8333.
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333" # S3 API
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9333/cluster/status >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  ironflow-1:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.54.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4223,nats://nats-3:4224
      --port=9123
      --node-id=node-1
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@postgres:5432/ironflow?sslmode=disable
      # One copy of each stream and system KV bucket per NATS node, so losing
      # one NATS node loses no data. Must not exceed the NATS cluster size.
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): a multi-node node requires a shared s3:// blob backend
      # or it refuses to boot. Points at the seaweedfs service above. Offload is
      # disabled by default (IRONFLOW_ARTIFACT_THRESHOLD unset) so no bucket is
      # needed to boot; to actually offload, set a threshold and pre-create the
      # ironflow-cluster-blobs bucket (e.g. aws-cli/mc against :8333).
      IRONFLOW_BLOB_URL: s3://ironflow-cluster-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9123:9123"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9123/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-2:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.54.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4223,nats://nats-3:4224
      --port=9124
      --node-id=node-2
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@postgres:5432/ironflow?sslmode=disable
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): a multi-node node requires a shared s3:// blob backend
      # or it refuses to boot. Points at the seaweedfs service above. Offload is
      # disabled by default (IRONFLOW_ARTIFACT_THRESHOLD unset) so no bucket is
      # needed to boot; to actually offload, set a threshold and pre-create the
      # ironflow-cluster-blobs bucket (e.g. aws-cli/mc against :8333).
      IRONFLOW_BLOB_URL: s3://ironflow-cluster-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9124:9124"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9124/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      # One node creates the JetStream streams first: three nodes creating
      # 3-copy streams at once time out on a fresh cluster.
      ironflow-1: { condition: service_healthy }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-3:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.54.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4223,nats://nats-3:4224
      --port=9125
      --node-id=node-3
    environment:
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@postgres:5432/ironflow?sslmode=disable
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # Observability (profile: monitoring): expose Prometheus /metrics on the
      # API port and export OTLP traces to the jaeger service. Traces default to
      # jaeger:4317, which only exists under --profile monitoring; bare runs log
      # harmless connection retries — set IRONFLOW_OTEL_ENDPOINT= to silence.
      # prometheus scrapes all three nodes; grafana renders the dashboards.
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # E5 gate (#411): a multi-node node requires a shared s3:// blob backend
      # or it refuses to boot. Points at the seaweedfs service above. Offload is
      # disabled by default (IRONFLOW_ARTIFACT_THRESHOLD unset) so no bucket is
      # needed to boot; to actually offload, set a threshold and pre-create the
      # ironflow-cluster-blobs bucket (e.g. aws-cli/mc against :8333).
      IRONFLOW_BLOB_URL: s3://ironflow-cluster-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9125:9125"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9125/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      # One node creates the JetStream streams first: three nodes creating
      # 3-copy streams at once time out on a fresh cluster.
      ironflow-1: { condition: service_healthy }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Observability (profile: monitoring). Scrapes /metrics from all three
  # ironflow nodes via cluster/prometheus.yml. Start with:
  #   docker compose -f docker-compose.cluster.yml --profile monitoring up
  # Grafana: point a Grafana instance at http://localhost:9090. See
  # docs/how-to-guides/observability.mdx for example queries.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.2.1
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Tracing backend (profile: monitoring). Receives OTLP traces from every
  # ironflow node at :4317. UI at http://localhost:16686. See observability.mdx.
  jaeger:
    restart: unless-stopped
    image: jaegertracing/jaeger:2.19.0
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4317:4317" # OTLP gRPC ingest

  # Dashboards (profile: monitoring). Auto-provisions the Prometheus datasource
  # and the Ironflow dashboards from ./grafana. UI at http://localhost:3000:
  # anonymous read-only (Viewer); log in as admin to edit. Dev defaults — set
  # GRAFANA_ADMIN_PASSWORD before exposing this stack beyond localhost.
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.0.2
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # NATS metrics exporter (profile: monitoring). NATS serves JSON on :8222
  # (/varz, /connz) — not Prometheus format — so this translates it to /metrics
  # on :7777, which Prometheus scrapes for the NATS Monitoring dashboard.
  nats-exporter:
    restart: unless-stopped
    image: natsio/prometheus-nats-exporter:0.20.1
    profiles:
      - monitoring
    command: ["-varz", "-connz", "-subz", "-routez", "-port=7777", "http://nats-1:8222", "http://nats-2:8222", "http://nats-3:8222"]
    depends_on:
      - nats-1
      - nats-2
      - nats-3

# The S3 identity comes from .env, so no key sits in a file in this tree.
configs:
  # fsync every JetStream write before the ack (ADR 0134). nats-server has no
  # flag for it, and its default acks first and fsyncs every 2 minutes. No
  # store_dir here: -sd sets it, and nats-server rejects the pair as a duplicate.
  nats_conf:
    content: |
      jetstream {
        sync_interval: always
        limits { default_max_consumers: -1 }
      }
  seaweedfs_s3:
    content: |
      {"identities": [{"name": "ironflow",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}", "secretKey": "${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  postgres_cluster_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  seaweedfs_data:
