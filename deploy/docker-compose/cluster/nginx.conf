# deploy/docker-compose/cluster/nginx.conf
# Plain round-robin: any node serves any request, those of HTTP pull workers
# included, because worker registrations and job leases live in the database
# (ADR 0138).
upstream ironflow {
    # A node that restarts can take a new address, and a name resolved only at start
    # keeps the old one.
    zone ironflow 64k;
    # Docker's embedded DNS, so this file works only inside a Docker network. It answers
    # with a 600s TTL, which valid overrides to bound how long an old address lasts.
    resolver 127.0.0.11 valid=5s;
    # A stopped node's name can answer SERVFAIL. nginx then keeps the old address and
    # asks again only after this timeout, 30s by default.
    resolver_timeout 3s;
    server ironflow-1:9123 resolve;
    server ironflow-2:9124 resolve;
    server ironflow-3:9125 resolve;
}

server {
    listen 9000;
    location / {
        proxy_pass http://ironflow;
        # A stopped node's address can drop packets instead of refusing them. The 60s
        # default then holds every request sent to it, worker job results included,
        # for a minute before nginx tries the next node. A connect that timed out sent
        # nothing, so even a POST or PUT moves on.
        proxy_connect_timeout 2s;
        # $http_host keeps the port; $host drops it, and an impersonated /ws
        # then fails the server's Origin-equals-Host check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for gRPC and ConnectRPC streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
