# deploy/docker-compose/cluster/docker-compose.ha.yml
# HA: 3 ironflow nodes behind nginx (:9000), a 5-node NATS JetStream cluster,
# and PostgreSQL with automatic failover: 3 Spilo (Patroni) nodes coordinated by
# a 3-node etcd cluster. Needs a .env from ./init-env.sh. Only nginx listens on
# all interfaces. Everything still runs on one host.
name: ironflow-ha
services:
  etcd-1:
    restart: unless-stopped
    image: quay.io/coreos/etcd:v3.7.2
    command: ["/usr/local/bin/etcd"]
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: ironflow-ha
    volumes:
      - etcd_1_data:/etcd-data
    # Only the PostgreSQL nodes reach etcd: it has no auth.
    networks: [dcs]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd-2:
    restart: unless-stopped
    image: quay.io/coreos/etcd:v3.7.2
    command: ["/usr/local/bin/etcd"]
    environment:
      ETCD_NAME: etcd-2
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: ironflow-ha
    volumes:
      - etcd_2_data:/etcd-data
    # Only the PostgreSQL nodes reach etcd: it has no auth.
    networks: [dcs]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd-3:
    restart: unless-stopped
    image: quay.io/coreos/etcd:v3.7.2
    command: ["/usr/local/bin/etcd"]
    environment:
      ETCD_NAME: etcd-3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: ironflow-ha
    volumes:
      - etcd_3_data:/etcd-data
    # Only the PostgreSQL nodes reach etcd: it has no auth.
    networks: [dcs]
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg-1:
    restart: unless-stopped
    # Spilo bundles several PostgreSQL majors; PGVERSION picks the one. Both
    # defaults are frozen at what initdb'd the pg_*_data volumes: a newer major
    # refuses them. Read the upgrade notes before you move either.
    image: ${SPILO_IMAGE:-ghcr.io/zalando/spilo-18:4.1-p2}
    hostname: pg-1
    # A clean PostgreSQL shutdown can outlast Docker's default 10s.
    stop_grace_period: 60s
    shm_size: 256mb
    networks: [default, dcs]
    environment:
      SCOPE: ironflow
      PGVERSION: ${PGVERSION:-18}
      ETCD3_HOSTS: "[etcd-1:2379, etcd-2:2379, etcd-3:2379]"
      PGROOT: /home/postgres/pgdata/pgroot
      PG_CONNECT_ADDRESS: pg-1:5432
      RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      PGPASSWORD_STANDBY: ${POSTGRES_REPLICATION_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      # A commit waits for one replica, so a failover never loses an
      # acknowledged write. Applies when the cluster is first created.
      SPILO_CONFIGURATION: "{bootstrap: {dcs: {synchronous_mode: true}}}"
    volumes:
      - pg_1_data:/home/postgres/pgdata
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    healthcheck:
      # 200 once PostgreSQL runs, as primary or replica.
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  pg-2:
    restart: unless-stopped
    image: ${SPILO_IMAGE:-ghcr.io/zalando/spilo-18:4.1-p2}
    hostname: pg-2
    # A clean PostgreSQL shutdown can outlast Docker's default 10s.
    stop_grace_period: 60s
    shm_size: 256mb
    networks: [default, dcs]
    environment:
      SCOPE: ironflow
      PGVERSION: ${PGVERSION:-18}
      ETCD3_HOSTS: "[etcd-1:2379, etcd-2:2379, etcd-3:2379]"
      PGROOT: /home/postgres/pgdata/pgroot
      PG_CONNECT_ADDRESS: pg-2:5432
      RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      PGPASSWORD_STANDBY: ${POSTGRES_REPLICATION_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      # A commit waits for one replica, so a failover never loses an
      # acknowledged write. Applies when the cluster is first created.
      SPILO_CONFIGURATION: "{bootstrap: {dcs: {synchronous_mode: true}}}"
    volumes:
      - pg_2_data:/home/postgres/pgdata
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    healthcheck:
      # 200 once PostgreSQL runs, as primary or replica.
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  pg-3:
    restart: unless-stopped
    image: ${SPILO_IMAGE:-ghcr.io/zalando/spilo-18:4.1-p2}
    hostname: pg-3
    # A clean PostgreSQL shutdown can outlast Docker's default 10s.
    stop_grace_period: 60s
    shm_size: 256mb
    networks: [default, dcs]
    environment:
      SCOPE: ironflow
      PGVERSION: ${PGVERSION:-18}
      ETCD3_HOSTS: "[etcd-1:2379, etcd-2:2379, etcd-3:2379]"
      PGROOT: /home/postgres/pgdata/pgroot
      PG_CONNECT_ADDRESS: pg-3:5432
      RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      PGPASSWORD_STANDBY: ${POSTGRES_REPLICATION_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      # A commit waits for one replica, so a failover never loses an
      # acknowledged write. Applies when the cluster is first created.
      SPILO_CONFIGURATION: "{bootstrap: {dcs: {synchronous_mode: true}}}"
    volumes:
      - pg_3_data:/home/postgres/pgdata
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      etcd-3: { condition: service_healthy }
    healthcheck:
      # 200 once PostgreSQL runs, as primary or replica.
      test: ["CMD", "curl", "-fs", "http://localhost:8008/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  # One-shot: creates the ironflow role and database on the current primary,
  # and sets the role's password from .env on every start. Spilo creates only
  # its own system roles.
  pg-init:
    image: ${SPILO_IMAGE:-ghcr.io/zalando/spilo-18:4.1-p2}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          psql "postgresql://postgres@pg-1:5432,pg-2:5432,pg-3:5432/postgres?sslmode=require&target_session_attrs=read-write&connect_timeout=5" \
            -v ON_ERROR_STOP=1 -v app_pw="$$APP_PASSWORD" -q <<'SQL' && exit 0
        DO $$$$ BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ironflow') THEN CREATE ROLE ironflow LOGIN; END IF;
        END $$$$;
        ALTER ROLE ironflow PASSWORD :'app_pw';
        SELECT 'CREATE DATABASE ironflow OWNER ironflow'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ironflow')\gexec
        SQL
          sleep 2
        done
        echo "pg-init: could not reach a writable PostgreSQL primary as postgres (check POSTGRES_SUPERUSER_PASSWORD)" >&2
        exit 1
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
      APP_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}
    # Started, not healthy: the loop waits for a primary, so one dead node
    # does not block the stack.
    depends_on:
      pg-1: { condition: service_started }
      pg-2: { condition: service_started }
      pg-3: { condition: service_started }

  nats-1:
    restart: unless-stopped
    image: nats:2.12.5-alpine
    command:
      - "-js"
      - "-n=nats-1"
      - "-sd=/data"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-1:6222"
      - "-routes=nats://nats-2:6222,nats://nats-3:6222,nats://nats-4:6222,nats://nats-5:6222"
      - "--cluster_name=ironflow-ha"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_1_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-2:
    restart: unless-stopped
    image: nats:2.12.5-alpine
    command:
      - "-js"
      - "-n=nats-2"
      - "-sd=/data"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-2:6222"
      - "-routes=nats://nats-1:6222,nats://nats-3:6222,nats://nats-4:6222,nats://nats-5:6222"
      - "--cluster_name=ironflow-ha"
    volumes:
      - nats_2_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-3:
    restart: unless-stopped
    image: nats:2.12.5-alpine
    command:
      - "-js"
      - "-n=nats-3"
      - "-sd=/data"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-3:6222"
      - "-routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-4:6222,nats://nats-5:6222"
      - "--cluster_name=ironflow-ha"
    volumes:
      - nats_3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-4:
    restart: unless-stopped
    image: nats:2.12.5-alpine
    command:
      - "-js"
      - "-n=nats-4"
      - "-sd=/data"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-4:6222"
      - "-routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222,nats://nats-5:6222"
      - "--cluster_name=ironflow-ha"
    volumes:
      - nats_4_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  nats-5:
    restart: unless-stopped
    image: nats:2.12.5-alpine
    command:
      - "-js"
      - "-n=nats-5"
      - "-sd=/data"
      - "-m=8222"
      - "-cluster"
      - "nats://nats-5:6222"
      - "-routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222,nats://nats-4:6222"
      - "--cluster_name=ironflow-ha"
    volumes:
      - nats_5_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      retries: 10

  # Shared S3 backend for blob overflow: one server, data on a volume.
  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.48
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-ip.bind=0.0.0.0",
      ]
    ports:
      # Set S3_HOST_PORT when another service already holds 8333.
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333" # S3 API
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9333/cluster/status >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  ironflow-1:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.51.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222,nats://nats-4:4222,nats://nats-5:4222
      --port=9123
      --node-id=node-1
    environment:
      # Every Postgres node is listed; pgx connects to whichever accepts writes,
      # so a failover needs no proxy and no config change.
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@pg-1:5432,pg-2:5432,pg-3:5432/ironflow?sslmode=require&target_session_attrs=read-write
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # One copy of each stream and KV bucket on 3 of the 5 NATS servers.
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # Offload is off until IRONFLOW_ARTIFACT_THRESHOLD is set and the
      # ironflow-ha-blobs bucket exists.
      IRONFLOW_BLOB_URL: s3://ironflow-ha-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9123:9123"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9123/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      pg-init: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      nats-4: { condition: service_healthy }
      nats-5: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-2:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.51.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222,nats://nats-4:4222,nats://nats-5:4222
      --port=9124
      --node-id=node-2
    environment:
      # Every Postgres node is listed; pgx connects to whichever accepts writes,
      # so a failover needs no proxy and no config change.
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@pg-1:5432,pg-2:5432,pg-3:5432/ironflow?sslmode=require&target_session_attrs=read-write
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # One copy of each stream and KV bucket on 3 of the 5 NATS servers.
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # Offload is off until IRONFLOW_ARTIFACT_THRESHOLD is set and the
      # ironflow-ha-blobs bucket exists.
      IRONFLOW_BLOB_URL: s3://ironflow-ha-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9124:9124"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9124/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      # One node creates the JetStream streams first: three nodes creating
      # 3-copy streams at once time out on a fresh cluster.
      ironflow-1: { condition: service_healthy }
      pg-init: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      nats-4: { condition: service_healthy }
      nats-5: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  ironflow-3:
    restart: unless-stopped
    image: ${IRONFLOW_IMAGE:-ghcr.io/sahina/ironflow-releases:0.51.0}
    command: >
      serve
      --nats-url=nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222,nats://nats-4:4222,nats://nats-5:4222
      --port=9125
      --node-id=node-3
    environment:
      # Every Postgres node is listed; pgx connects to whichever accepts writes,
      # so a failover needs no proxy and no config change.
      IRONFLOW_DATABASE_URL: postgres://ironflow:${POSTGRES_PASSWORD:?set it in .env (new install - run ./init-env.sh)}@pg-1:5432,pg-2:5432,pg-3:5432/ironflow?sslmode=require&target_session_attrs=read-write
      IRONFLOW_MASTER_KEY: ${IRONFLOW_MASTER_KEY:?set it in .env (new install - run ./init-env.sh)}
      # Shared by every node, so a dashboard login made on one node works on all.
      IRONFLOW_JWT_SECRET: ${IRONFLOW_JWT_SECRET:?set it in .env (new install - run ./init-env.sh)}
      # First-boot admin key (init-env.sh writes one); unset = generated key file.
      IRONFLOW_BOOTSTRAP_ADMIN_KEY: ${IRONFLOW_BOOTSTRAP_ADMIN_KEY:-}
      # Dashboard password for admin@ironflow.local, set at first boot.
      IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${IRONFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      IRONFLOW_STALE_CLAIM_THRESHOLD:
      NATS_CREDS_FILE:
      # One copy of each stream and KV bucket on 3 of the 5 NATS servers.
      NATS_STREAM_REPLICAS: ${NATS_STREAM_REPLICAS:-3}
      IRONFLOW_METRICS_ENABLED: ${IRONFLOW_METRICS_ENABLED:-true}
      IRONFLOW_OTEL_ENDPOINT: ${IRONFLOW_OTEL_ENDPOINT:-jaeger:4317}
      IRONFLOW_OTEL_SAMPLE_RATE: ${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      IRONFLOW_OTEL_SERVICE_NAME: ${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
      # Offload is off until IRONFLOW_ARTIFACT_THRESHOLD is set and the
      # ironflow-ha-blobs bucket exists.
      IRONFLOW_BLOB_URL: s3://ironflow-ha-blobs?endpoint=http://seaweedfs:8333&region=us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}
    ports:
      - "127.0.0.1:9125:9125"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9125/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      # One node creates the JetStream streams first: three nodes creating
      # 3-copy streams at once time out on a fresh cluster.
      ironflow-1: { condition: service_healthy }
      pg-init: { condition: service_completed_successfully }
      nats-1: { condition: service_healthy }
      nats-2: { condition: service_healthy }
      nats-3: { condition: service_healthy }
      nats-4: { condition: service_healthy }
      nats-5: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  nginx:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Observability (profile: monitoring). Scrapes /metrics from all three
  # ironflow nodes via cluster/prometheus.yml. Start with:
  #   docker compose -f docker-compose.ha.yml --profile monitoring up
  # Grafana: point a Grafana instance at http://localhost:9090. See
  # docs/how-to-guides/observability.mdx for example queries.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.2.1
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ironflow-1
      - ironflow-2
      - ironflow-3

  # Tracing backend (profile: monitoring). Receives OTLP traces from every
  # ironflow node at :4317. UI at http://localhost:16686. See observability.mdx.
  jaeger:
    restart: unless-stopped
    image: jaegertracing/jaeger:2.19.0
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4317:4317" # OTLP gRPC ingest

  # Dashboards (profile: monitoring). Auto-provisions the Prometheus datasource
  # and the Ironflow dashboards from ./grafana. UI at http://localhost:3000:
  # anonymous read-only (Viewer); log in as admin to edit. Dev defaults — set
  # GRAFANA_ADMIN_PASSWORD before exposing this stack beyond localhost.
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.0.2
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # NATS metrics exporter (profile: monitoring). NATS serves JSON on :8222
  # (/varz, /connz) — not Prometheus format — so this translates it to /metrics
  # on :7777, which Prometheus scrapes for the NATS Monitoring dashboard.
  nats-exporter:
    restart: unless-stopped
    image: natsio/prometheus-nats-exporter:0.20.1
    profiles:
      - monitoring
    command: ["-varz", "-connz", "-subz", "-routez", "-port=7777", "http://nats-1:8222", "http://nats-2:8222", "http://nats-3:8222", "http://nats-4:8222", "http://nats-5:8222"]
    depends_on:
      - nats-1
      - nats-2
      - nats-3
      - nats-4
      - nats-5

# The S3 identity comes from .env, so no key sits in a file in this tree.
configs:
  seaweedfs_s3:
    content: |
      {"identities": [{"name": "ironflow",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY:?set it in .env (new install - run ./init-env.sh)}", "secretKey": "${S3_SECRET_KEY:?set it in .env (new install - run ./init-env.sh)}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

networks:
  dcs:

volumes:
  etcd_1_data:
  etcd_2_data:
  etcd_3_data:
  pg_1_data:
  pg_2_data:
  pg_3_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  nats_4_data:
  nats_5_data:
  seaweedfs_data:
