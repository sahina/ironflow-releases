# docker-compose.single-node.yml
# Single-node Ironflow: one server (embedded NATS + SQLite by default), optional
# PostgreSQL (`--profile postgres`) and Prometheus + Grafana on :3000 (`--profile monitoring`).
# Run with: docker compose -f docker-compose.single-node.yml up  (or `make docker-up`).
# For multi-node clusters see deploy/docker-compose/cluster/.
name: ironflow
services:
  ironflow:
    # Covers the worst-case shutdown drain. Docker's default 10s kills it mid-drain.
    stop_grace_period: 100s
    image: ghcr.io/sahina/ironflow-releases:${VERSION:-0.56.0}
    ports:
      - "${IRONFLOW_PORT:-9123}:9123"
      - "127.0.0.1:${IRONFLOW_METRICS_HOST_PORT:-9223}:9223"
    command: serve --bootstrap-key-file=/data/.ironflow/.ironflow_bootstrap_key.json --metrics-port=9223
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - IRONFLOW_BLOB_URL=${IRONFLOW_BLOB_URL:-}
      - IRONFLOW_JWT_SECRET=${IRONFLOW_JWT_SECRET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - IRONFLOW_DATABASE_URL=${IRONFLOW_DATABASE_URL:-}
      - NATS_STORE_DIR=${NATS_STORE_DIR:-/data/nats}
      - IRONFLOW_MASTER_KEY=${IRONFLOW_MASTER_KEY:-}
      - IRONFLOW_ENV=${IRONFLOW_ENV:-default}
      - IRONFLOW_METRICS_ENABLED=${IRONFLOW_METRICS_ENABLED:-true}
      - IRONFLOW_OTEL_ENDPOINT=${IRONFLOW_OTEL_ENDPOINT:-}
      - IRONFLOW_OTEL_SAMPLE_RATE=${IRONFLOW_OTEL_SAMPLE_RATE:-1.0}
      - IRONFLOW_OTEL_SERVICE_NAME=${IRONFLOW_OTEL_SERVICE_NAME:-ironflow}
    volumes:
      - ironflow-data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9123/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    # The default is frozen at the major that initdb'd the postgres-data volume
    # below — a newer major refuses to boot against it. Override POSTGRES_IMAGE
    # only after migrating the volume (pg_dump/restore or pg_upgrade).
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironflow}
      POSTGRES_DB: ${POSTGRES_DB:-ironflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the setup server at first start listens only on the local socket,
      # so a socket probe can pass before the engine can connect.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-ironflow} -d $${POSTGRES_DB:-ironflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    configs:
      - source: postgres_flush_hba
        target: /docker-entrypoint-initdb.d/flush-hba.sh

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
    depends_on:
      ironflow:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.0
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/docker-compose/cluster/grafana/provisioning:/etc/grafana/provisioning:ro
      # One file, not the directory: the provider loads every dashboard there, and
      # single-node has no NATS exporter for nats-monitoring.json.
      - ./deploy/docker-compose/cluster/grafana/dashboards/ironflow-performance.json:/var/lib/grafana/dashboards/ironflow-performance.json:ro
    depends_on:
      - prometheus

configs:
  # The image appends its rule for TCP logins to pg_hba.conf at first start and does
  # not flush it. A host reset then loses the rule while PG_VERSION survives, so init
  # never runs again and every TCP login fails while the health check passes (#3715).
  postgres_flush_hba:
    content: |
      sync

volumes:
  ironflow-data:
  postgres-data:
