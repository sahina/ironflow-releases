global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/*.yml

scrape_configs:
  - job_name: ironflow
    static_configs:
      - targets: ["127.0.0.1:9123"]
  - job_name: nats
    static_configs:
      - targets: ["127.0.0.1:7777"]
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
  - job_name: blackbox
    metrics_path: /probe
    static_configs:
      - targets: ["127.0.0.1:4222"]
        labels:
          target: nats
          module: tcp_connect
      - targets: ["127.0.0.1:5432"]
        labels:
          target: postgresql
          module: tcp_connect
      - targets: ["http://127.0.0.1:9123/health"]
        labels:
          target: ironflow-health
          module: http_2xx
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
