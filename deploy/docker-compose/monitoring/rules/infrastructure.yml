groups:
- name: appliance.infrastructure
  rules:
  - alert: NATSDown
    expr: probe_success{job="blackbox", target="nats"} == 0 or absent(probe_success{job="blackbox", target="nats"})
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: NATS is unreachable
      description: TCP probe to NATS has been failing for more than 2 minutes.
      runbook_url: https://docs.ironflow.run/how-to-guides/deployment/docker-compose/
  - alert: PostgreSQLDown
    expr: probe_success{job="blackbox", target="postgresql"} == 0 or absent(probe_success{job="blackbox",
      target="postgresql"})
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: PostgreSQL is unreachable
      description: TCP probe to PostgreSQL has been failing for more than 2 minutes.
      runbook_url: https://docs.ironflow.run/how-to-guides/deployment/docker-compose/
  - alert: DiskSpaceLow
    expr: (node_filesystem_avail_bytes{job="node", mountpoint="/var/lib/ironflow"} / node_filesystem_size_bytes{job="node",
      mountpoint="/var/lib/ironflow"}) < 0.15
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Disk space low
      description: The appliance data filesystem has less than 15% free space.
  - alert: ProbeFailure
    expr: probe_success{job="blackbox", target="ironflow-health"} == 0 or absent(probe_success{job="blackbox",
      target="ironflow-health"})
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Ironflow health probe failing
      description: BlackBox Exporter HTTP probe to Ironflow /health has been failing for more than 2 minutes.
  - alert: MemoryPressure
    expr: (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) >
      0.85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Appliance memory pressure
      description: The appliance has less than 15% memory available for more than 10 minutes.
  - alert: AlertmanagerFailedNotifications
    expr: rate(alertmanager_notifications_failed_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Alertmanager failing to send notifications
      description: Alertmanager has been failing to send notifications for the last 5 minutes. Check Slack
        webhook URL and Healthchecks.io configuration.
